<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="20" y1="16" x2="940" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04FEEE"/>
      <stop offset="52%" stop-color="#7DF9FF"/>
      <stop offset="100%" stop-color="#FF8FD0"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#1A1B2E" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Offset Pop-Comic Shadow -->
  <rect x="26" y="26" width="908" height="164" rx="34" fill="#1A1B2E" stroke="#1A1B2E" stroke-width="8"/>
  <!-- Outer Cream Frame -->
  <rect x="18" y="14" width="908" height="164" rx="34" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="8"/>
  <!-- Inner Gradient Plate -->
  <rect x="28" y="24" width="888" height="144" rx="26" fill="url(#bgGrad)" stroke="#1A1B2E" stroke-width="4"/>
  <rect x="28" y="24" width="888" height="144" rx="26" fill="url(#dots)"/>
  <!-- Stage Light Stripes -->
  <polygon points="640,24 715,24 655,168 580,168" fill="#FFFFFF" fill-opacity="0.22"/>
  <polygon points="735,24 778,24 718,168 675,168" fill="#FFFFFF" fill-opacity="0.16"/>
  <!-- Unit Palette Dots -->
  <circle cx="66" cy="34" r="9" fill="#04FEEE" stroke="#1A1B2E" stroke-width="3.5"/>
  <circle cx="94" cy="34" r="9" fill="#8EA3FF" stroke="#1A1B2E" stroke-width="3.5"/>
  <circle cx="122" cy="34" r="9" fill="#8CE97A" stroke="#1A1B2E" stroke-width="3.5"/>
  <circle cx="150" cy="34" r="9" fill="#FF6B8B" stroke="#1A1B2E" stroke-width="3.5"/>
  <circle cx="178" cy="34" r="9" fill="#FFB833" stroke="#1A1B2E" stroke-width="3.5"/>
  <circle cx="206" cy="34" r="9" fill="#C4A5FF" stroke="#1A1B2E" stroke-width="3.5"/>
  <circle cx="234" cy="34" r="9" fill="#E2E8F0" stroke="#1A1B2E" stroke-width="3.5"/>
  <!-- Platform Tag -->
  <g transform="translate(726 30)">
    <rect x="2" y="3" width="166" height="32" rx="16" fill="#1A1B2E"/>
    <rect x="0" y="0" width="166" height="32" rx="16" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="3.5"/>
    <text x="83" y="21" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="900" fill="#1A1B2E">WINDOWS 10 · C++20</text>
  </g>
  <!-- Gem + Title -->
  <g transform="translate(88 108) rotate(45)">
    <rect x="-18" y="-18" width="36" height="36" rx="7" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="5"/>
    <rect x="-8" y="-8" width="16" height="16" rx="3" fill="#FFE57A" stroke="#1A1B2E" stroke-width="3"/>
  </g>
  <text x="132" y="122" font-family="Segoe UI, system-ui, -apple-system, Arial Black, sans-serif" font-size="60" font-weight="900" letter-spacing="-1" fill="#1A1B2E">SekaiDesk</text>
  <text x="135" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#1A1B2E">Project Sekai Pop-Comic Desktop Shell for Windows 10 — Qt 6.8 Quick + Win32 / WinRT</text>
  <!-- Right Seal -->
  <g transform="translate(758 112) rotate(-3)">
    <rect x="2" y="4" width="132" height="38" rx="19" fill="#1A1B2E"/>
    <rect x="0" y="0" width="132" height="38" rx="19" fill="#FFE57A" stroke="#1A1B2E" stroke-width="3.5"/>
    <text x="66" y="24" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="900" fill="#1A1B2E">v0.1.0 · WIN64</text>
  </g>
</svg>
