<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="26" y1="24" x2="918" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04FEEE"/>
      <stop offset="48%" stop-color="#8AF7FF"/>
      <stop offset="100%" stop-color="#FF96D5"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04FEEE"/>
      <stop offset="100%" stop-color="#FF7AC6"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#1A1B2E" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Offset Pop-Comic Drop Shadow -->
  <rect x="24" y="24" width="914" height="168" rx="32" fill="#1A1B2E"/>

  <!-- Outer Cream Frame -->
  <rect x="14" y="14" width="914" height="168" rx="32" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="7"/>

  <!-- Inner Gradient Plate -->
  <rect x="25" y="25" width="892" height="146" rx="23" fill="url(#bgGrad)" stroke="#1A1B2E" stroke-width="3.5"/>
  <rect x="25" y="25" width="892" height="146" rx="23" fill="url(#dots)"/>

  <!-- Subtle Stage Light Diagonal Beams -->
  <polygon points="650,27 726,27 666,169 590,169" fill="#FFFFFF" fill-opacity="0.22"/>
  <polygon points="746,27 788,27 728,169 686,169" fill="#FFFFFF" fill-opacity="0.15"/>

  <!-- Top Strip: 7 Sekai Unit Palette Swatches (Left) -->
  <g transform="translate(52 44)">
    <rect x="0"   y="0" width="16" height="8" rx="4" fill="#04FEEE" stroke="#1A1B2E" stroke-width="2.5"/>
    <rect x="22"  y="0" width="16" height="8" rx="4" fill="#8EA3FF" stroke="#1A1B2E" stroke-width="2.5"/>
    <rect x="44"  y="0" width="16" height="8" rx="4" fill="#8CE97A" stroke="#1A1B2E" stroke-width="2.5"/>
    <rect x="66"  y="0" width="16" height="8" rx="4" fill="#FF6B8B" stroke="#1A1B2E" stroke-width="2.5"/>
    <rect x="88"  y="0" width="16" height="8" rx="4" fill="#FFB833" stroke="#1A1B2E" stroke-width="2.5"/>
    <rect x="110" y="0" width="16" height="8" rx="4" fill="#C4A5FF" stroke="#1A1B2E" stroke-width="2.5"/>
    <rect x="132" y="0" width="16" height="8" rx="4" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="2.5"/>
  </g>

  <!-- Top Strip: Clean Non-Overlapping Badges (Right) -->
  <g transform="translate(658 37)">
    <rect x="2" y="3" width="132" height="28" rx="14" fill="#1A1B2E"/>
    <rect x="0" y="0" width="132" height="28" rx="14" fill="#FFE57A" stroke="#1A1B2E" stroke-width="3"/>
    <text x="66" y="18.5" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="900" fill="#1A1B2E">v0.1.0 · GPL-3.0</text>
  </g>
  <g transform="translate(800 37)">
    <rect x="2" y="3" width="96" height="28" rx="14" fill="#1A1B2E"/>
    <rect x="0" y="0" width="96" height="28" rx="14" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="3"/>
    <text x="48" y="18.5" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="900" fill="#1A1B2E">WIN10 · x64</text>
  </g>

  <!-- Signature Sekai "S" App Tile -->
  <g transform="translate(52 78)">
    <rect x="3" y="4" width="72" height="72" rx="18" fill="#1A1B2E"/>
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="4"/>
    <rect x="7" y="7" width="58" height="58" rx="13" fill="url(#iconGrad)" stroke="#1A1B2E" stroke-width="2.5"/>
    <text x="36" y="51" text-anchor="middle" font-family="Segoe UI, Arial Black, system-ui, sans-serif" font-size="42" font-weight="900" fill="#1A1B2E">S</text>
    <!-- Tiny 4-point Sparkle -->
    <path d="M58 10 L60 15 L65 17 L60 19 L58 24 L56 19 L51 17 L56 15 Z" fill="#FFFDF9" stroke="#1A1B2E" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Main Title & Spacious Subtitle -->
  <text x="144" y="122" font-family="Segoe UI, Arial Black, system-ui, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.2" fill="#1A1B2E">SekaiDesk</text>
  <text x="147" y="149" font-family="Segoe UI, system-ui, sans-serif" font-size="16.5" font-weight="800" fill="#1A1B2E">Pop-Comic Desktop Shell for Windows 10 — Qt 6.8 Quick + Win32 / WinRT</text>
</svg>
